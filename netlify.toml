# Netlify deploys the static export in /out.
# Forms: the "waitlist" form is registered from public/__forms.html.
# In the Netlify dashboard, turn on form detection once (Forms > Enable form detection).
[build]
  command = "npm run build"
  publish = "out"

# The Open Graph image is exported without a file extension. Tell crawlers it's a PNG
# so link previews (WhatsApp, LinkedIn, X) show it.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
